name: TV Cast APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  START_URL: "https://hamzakivrak.github.io/TVHKTV/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/res/drawable-xhdpi app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'TVCAST_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVCast"
          include ':app'
          TVCAST_EOF
          cat > build.gradle <<'TVCAST_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          TVCAST_EOF
          cat > gradle.properties <<'TVCAST_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          TVCAST_EOF
          mkdir -p app
          cat > app/build.gradle <<'TVCAST_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tvcast.player'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tvcast.player"
                  minSdk 21
                  targetSdk 34
                  versionCode 9
                  versionName "1.8"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
              implementation 'androidx.mediarouter:mediarouter:1.7.0'
          }
          TVCAST_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/automotive_app_desc.xml <<'TVCAST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="media" />
          </automotiveApp>
          TVCAST_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'TVCAST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:banner="@drawable/banner"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation|uiMode|screenLayout|smallestScreenSize"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME"
                      android:value="com.tvcast.player.CastOptionsProvider" />
                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />
                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          TVCAST_EOF
          mkdir -p app/src/main/java/com/tvcast/player
          cat > app/src/main/java/com/tvcast/player/MainActivity.java <<'TVCAST_EOF'
          package com.tvcast.player;

          import android.Manifest;
          import android.app.Activity;
          import android.app.UiModeManager;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.util.Enumeration;
          import org.json.JSONObject;
          import android.content.BroadcastReceiver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.ValueCallback;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceResponse;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {

              private static final String BASE_URL = "https://tvcast.app/";
              private WebView web;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customCb;
              private long lastBack = 0;
              private boolean fellBack = false;
              private final AdRules rules = new AdRules();
              private BroadcastReceiver cmdReceiver;
              private boolean serviceUp = false;
              private RemoteServer remote;
              private CastHelper castH;
              private CastProxy castProxy;

              private CastHelper castHelper() {
                  if (castH == null) {
                      castH = new CastHelper(this, new CastHelper.Out() {
                          @Override
                          public void js(String s) { jsCb(s); }
                      });
                  }
                  return castH;
              }
              private static final int REMOTE_PORT = 8765;
              private ValueCallback<Uri[]> fileCb;
              private static final int REQ_FILE = 7421;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF000000);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);
                  rules.load(this);
                  setupWebView();
                  registerCommandReceiver();
                  startRemote();
                  askNotificationPermission();
                  immersive();
                  load();
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportMultipleWindows(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setBackgroundColor(0xFF000000);
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus();

                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          try {
                              if (!rules.enabled) return null;
                              Uri u = r.getUrl();
                              if (rules.shouldBlock(u)) {
                                  return new WebResourceResponse("text/plain", "utf-8", 204, "No Content", new HashMap<String, String>(), new java.io.ByteArrayInputStream(new byte[0]));
                              }
                              if (!r.isForMainFrame() && "GET".equalsIgnoreCase(r.getMethod()) && rules.shouldInject(u)) {
                                  WebResourceResponse x = injectIntoEmbed(r);
                                  if (x != null) return x;
                              }
                          } catch (Throwable t) {
                              // Hata olursa normal yukleme devam eder
                          }
                          return null;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame() && !fellBack) {
                              fellBack = true;
                              loadBundled();
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view;
                          customCb = cb;
                          root.addView(view, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          web.setVisibility(View.GONE);
                          immersive();
                      }

                      @Override
                      public void onHideCustomView() {
                          hideCustom();
                      }

                      @Override
                      public Bitmap getDefaultVideoPoster() {
                          return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) { try { fileCb.onReceiveValue(null); } catch (Exception ignored) { } }
                          fileCb = cb;
                          try {
                              Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType("*/*");
                              startActivityForResult(Intent.createChooser(i, "Dosya seç"), REQ_FILE);
                              return true;
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                      }
                  });
              }

              private void hideCustom() {
                  if (customView == null) return;
                  root.removeView(customView);
                  customView = null;
                  web.setVisibility(View.VISIBLE);
                  if (customCb != null) { try { customCb.onCustomViewHidden(); } catch (Exception ignored) {} customCb = null; }
                  web.requestFocus();
                  immersive();
              }

              private void load() {
                  String url = getString(R.string.start_url).trim();
                  if (url.length() > 0) {
                      web.loadUrl(url + (url.contains("?") ? "&" : "?") + "tv=1&t=" + System.currentTimeMillis());
                  } else {
                      loadBundled();
                  }
              }

              private void loadBundled() {
                  try {
                      InputStream in = getAssets().open("tvcast.html");
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      String html = out.toString("UTF-8");
                      String inject = "<script>try{localStorage.setItem('tv_tv_mode','1')}catch(e){}</script>";
                      int i = html.indexOf("<head>");
                      html = (i >= 0) ? html.substring(0, i + 6) + inject + html.substring(i + 6) : inject + html;
                      web.loadDataWithBaseURL(BASE_URL, html, "text/html", "UTF-8", null);
                  } catch (Exception e) {
                      Toast.makeText(this, "tvcast.html yüklenemedi", Toast.LENGTH_LONG).show();
                  }
              }

              /** JS -> Java kopru (window.Android) */
              private class Bridge {
                  @JavascriptInterface
                  public boolean isCellular() {
                      try {
                          ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                          if (cm == null) return false;
                          if (Build.VERSION.SDK_INT >= 23) {
                              Network n = cm.getActiveNetwork();
                              if (n == null) return false;
                              NetworkCapabilities c = cm.getNetworkCapabilities(n);
                              return c != null && c.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) && !c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) && !c.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET);
                          }
                          NetworkInfo ni = cm.getActiveNetworkInfo();
                          return ni != null && ni.getType() == ConnectivityManager.TYPE_MOBILE;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void nowPlaying(String title, boolean playing) {
                      startPlayback(title, playing);
                  }

                  @JavascriptInterface
                  public void saveRules(String text) {
                      if (text != null && text.length() > 20 && text.length() < 200000) rules.save(MainActivity.this, text);
                  }

                  @JavascriptInterface
                  public String saveFile(String name, String text) {
                      try {
                          String safe = (name == null || name.isEmpty()) ? "tvcast-yedek.json" : name.replaceAll("[^A-Za-z0-9._-]", "_");
                          byte[] data = (text == null ? "" : text).getBytes("UTF-8");
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                              v.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (u == null) return "";
                              OutputStream o = getContentResolver().openOutputStream(u);
                              o.write(data);
                              o.close();
                              return "İndirilenler/" + safe;
                          } else {
                              File dir = getExternalFilesDir(null);
                              if (dir == null) return "";
                              File f = new File(dir, safe);
                              FileOutputStream o = new FileOutputStream(f);
                              o.write(data);
                              o.close();
                              return f.getAbsolutePath();
                          }
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String remoteInfo() {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("enabled", remoteEnabled());
                          o.put("ip", localIp());
                          o.put("port", REMOTE_PORT);
                          o.put("code", remoteCode());
                          return o.toString();
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public void setRemoteEnabled(boolean on) {
                      rp().edit().putBoolean("enabled", on).apply();
                      startRemote();
                  }

                  @JavascriptInterface
                  public String newRemoteCode() {
                      String c = String.format(Locale.US, "%04d", new java.util.Random().nextInt(10000));
                      rp().edit().putString("code", c).apply();
                      startRemote();
                      return c;
                  }

                  @JavascriptInterface
                  public void tvPing(final String ip, final String code) {
                      if (ip == null || !ip.matches("^[0-9]{1,3}(\\.[0-9]{1,3}){3}$")) return;
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              boolean ok = false;
                              String msg = "";
                              try {
                                  HttpURLConnection c = (HttpURLConnection) new URL("http://" + ip + ":" + REMOTE_PORT + "/ping?code=" + code).openConnection();
                                  c.setConnectTimeout(3000);
                                  c.setReadTimeout(4000);
                                  int rc = c.getResponseCode();
                                  ok = rc == 200;
                                  msg = rc == 403 ? "Kod yanlış" : (ok ? "" : "HTTP " + rc);
                                  c.disconnect();
                              } catch (Exception e) {
                                  msg = "Ulaşılamadı (TV açık mı, uygulama çalışıyor mu, aynı Wi-Fi mi?)";
                              }
                              jsCb("window.__tvPingDone&&__tvPingDone(" + JSONObject.quote(ip) + "," + ok + "," + JSONObject.quote(msg) + ")");
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void castScan() { castHelper().scan(); }

                  @JavascriptInterface
                  public void castPlay(String id, String url, String mime, String title, String logo) {
                      String u = url;
                      try {
                          String ip = localIp();
                          if (ip.length() > 0 && url != null && url.startsWith("http")) {
                              if (castProxy == null) castProxy = new CastProxy();
                              if (castProxy.start(ip)) { castProxy.setHost(ip); u = castProxy.wrap(url); }
                          }
                      } catch (Throwable ignored) { }
                      castHelper().play(id, u, mime, title, logo);
                  }

                  @JavascriptInterface
                  public void castToggle() { castHelper().toggle(); }

                  @JavascriptInterface
                  public void castStop() { castHelper().stop(); }

                  @JavascriptInterface
                  public void tvScan(final String code) {
                      final java.util.List<String> mine = localIps();
                      if (mine.isEmpty()) { jsCb("window.__tvScanDone&&__tvScanDone([]," + JSONObject.quote("Wi-Fi adresi alinamadi") + ")"); return; }
                      final String cd = (code == null || code.length() != 4) ? "0000" : code;
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              final java.util.List<String> found = java.util.Collections.synchronizedList(new java.util.ArrayList<String>());
                              java.util.concurrent.ExecutorService ex = java.util.concurrent.Executors.newFixedThreadPool(64);
                              StringBuilder scanned = new StringBuilder();
                              java.util.HashSet<String> seen = new java.util.HashSet<String>();
                              for (final String me : mine) {
                                  final String prefix = me.substring(0, me.lastIndexOf('.') + 1);
                                  if (!seen.add(prefix)) continue;
                                  scanned.append(prefix).append("x ");
                                  for (int i = 1; i < 255; i++) {
                                      final String ip = prefix + i;
                                      if (mine.contains(ip)) continue;
                                      ex.execute(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  HttpURLConnection c = (HttpURLConnection) new URL("http://" + ip + ":" + REMOTE_PORT + "/ping?code=" + cd).openConnection();
                                                  c.setConnectTimeout(900);
                                                  c.setReadTimeout(1500);
                                                  int rc = c.getResponseCode();
                                                  if (rc == 200 || rc == 403) found.add(ip + "|" + (rc == 200));
                                                  c.disconnect();
                                              } catch (Exception ignored) { }
                                          }
                                      });
                                  }
                              }
                              ex.shutdown();
                              try { ex.awaitTermination(30, java.util.concurrent.TimeUnit.SECONDS); } catch (Exception ignored) { }
                              org.json.JSONArray arr = new org.json.JSONArray();
                              synchronized (found) { for (String f : found) arr.put(f); }
                              jsCb("window.__tvScanDone&&__tvScanDone(" + arr.toString() + "," + JSONObject.quote(scanned.toString()) + ")");
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void tvSend(final String ip, final String code, final String json) {
                      if (ip == null || !ip.matches("^[0-9]{1,3}(\\.[0-9]{1,3}){3}$")) return;
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              boolean ok = false;
                              String msg = "";
                              try {
                                  JSONObject o = new JSONObject(json);
                                  o.put("code", code);
                                  byte[] b = o.toString().getBytes("UTF-8");
                                  HttpURLConnection c = (HttpURLConnection) new URL("http://" + ip + ":" + REMOTE_PORT + "/cmd").openConnection();
                                  c.setConnectTimeout(3000);
                                  c.setReadTimeout(5000);
                                  c.setRequestMethod("POST");
                                  c.setDoOutput(true);
                                  c.setRequestProperty("Content-Type", "application/json");
                                  c.setRequestProperty("Content-Length", String.valueOf(b.length));
                                  OutputStream os = c.getOutputStream();
                                  os.write(b);
                                  os.close();
                                  int rc = c.getResponseCode();
                                  ok = rc == 200;
                                  msg = rc == 403 ? "Kod yanlış" : (ok ? "" : "HTTP " + rc);
                                  c.disconnect();
                              } catch (Exception e) {
                                  msg = "TV'ye ulaşılamadı";
                              }
                              jsCb("window.__tvSendDone&&__tvSendDone(" + ok + "," + JSONObject.quote(msg) + ")");
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void setAdBlock(boolean on) {
                      rules.setEnabled(MainActivity.this, on);
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE) {
                      Uri[] r = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getData() != null) {
                              r = new Uri[] { data.getData() };
                          } else if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              r = new Uri[n];
                              for (int k = 0; k < n; k++) r[k] = data.getClipData().getItemAt(k).getUri();
                          }
                      }
                      if (fileCb != null) { fileCb.onReceiveValue(r); fileCb = null; }
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              private SharedPreferences rp() {
                  return getSharedPreferences("tvcast_remote", MODE_PRIVATE);
              }

              private String remoteCode() {
                  String c = rp().getString("code", "");
                  if (c.length() != 4) {
                      c = String.format(Locale.US, "%04d", new java.util.Random().nextInt(10000));
                      rp().edit().putString("code", c).apply();
                  }
                  return c;
              }

              private boolean isTvDevice() {
                  try {
                      UiModeManager m = (UiModeManager) getSystemService(Context.UI_MODE_SERVICE);
                      return m != null && m.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private boolean remoteEnabled() {
                  return rp().getBoolean("enabled", isTvDevice());
              }

              private void startRemote() {
                  stopRemote();
                  if (!remoteEnabled()) return;
                  remote = new RemoteServer(REMOTE_PORT, remoteCode(), new RemoteServer.Handler() {
                      @Override
                      public void onCommand(final String json) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try { web.evaluateJavascript("try{tvRemoteCmd(" + json + ")}catch(e){}", null); } catch (Exception ignored) { }
                              }
                          });
                      }
                  });
                  remote.start();
              }

              private void stopRemote() {
                  if (remote != null) { remote.stop(); remote = null; }
              }

              private java.util.List<String> localIps() {
                  java.util.List<String> pref = new java.util.ArrayList<String>();
                  java.util.List<String> rest = new java.util.ArrayList<String>();
                  try {
                      Enumeration<NetworkInterface> en = NetworkInterface.getNetworkInterfaces();
                      while (en != null && en.hasMoreElements()) {
                          NetworkInterface ni = en.nextElement();
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          String nm = ni.getName() == null ? "" : ni.getName().toLowerCase(Locale.US);
                          boolean lan = nm.startsWith("wlan") || nm.startsWith("eth") || nm.startsWith("ap") || nm.startsWith("swlan");
                          Enumeration<InetAddress> ad = ni.getInetAddresses();
                          while (ad.hasMoreElements()) {
                              InetAddress a = ad.nextElement();
                              if (a instanceof java.net.Inet4Address && !a.isLoopbackAddress() && a.isSiteLocalAddress()) {
                                  (lan ? pref : rest).add(a.getHostAddress());
                              }
                          }
                      }
                  } catch (Exception ignored) { }
                  pref.addAll(rest);
                  return pref;
              }

              private String localIp() {
                  java.util.List<String> l = localIps();
                  return l.isEmpty() ? "" : l.get(0);
              }

              private void jsCb(final String js) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try { web.evaluateJavascript(js, null); } catch (Exception ignored) { }
                      }
                      });
              }

              private void startPlayback(String title, boolean playing) {
