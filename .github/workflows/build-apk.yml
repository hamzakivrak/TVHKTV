name: TV Cast APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  START_URL: "https://hamzakivrak.github.io/TVHKTV/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/res/drawable-xhdpi app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'TVCAST_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVCast"
          include ':app'
          TVCAST_EOF
          cat > build.gradle <<'TVCAST_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          TVCAST_EOF
          cat > gradle.properties <<'TVCAST_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          TVCAST_EOF
          mkdir -p app
          cat > app/build.gradle <<'TVCAST_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tvcast.player'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tvcast.player"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          TVCAST_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/automotive_app_desc.xml <<'TVCAST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="media" />
          </automotiveApp>
          TVCAST_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'TVCAST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:banner="@drawable/banner"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation|uiMode|screenLayout|smallestScreenSize"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />
                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          TVCAST_EOF
          mkdir -p app/src/main/java/com/tvcast/player
          cat > app/src/main/java/com/tvcast/player/MainActivity.java <<'TVCAST_EOF'
          package com.tvcast.player;

          import android.Manifest;
          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceResponse;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {

              private static final String BASE_URL = "https://tvcast.app/";
              private WebView web;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customCb;
              private long lastBack = 0;
              private boolean fellBack = false;
              private final AdRules rules = new AdRules();
              private BroadcastReceiver cmdReceiver;
              private boolean serviceUp = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF000000);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);
                  rules.load(this);
                  setupWebView();
                  registerCommandReceiver();
                  askNotificationPermission();
                  immersive();
                  load();
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportMultipleWindows(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setBackgroundColor(0xFF000000);
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus();

                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          try {
                              if (!rules.enabled) return null;
                              Uri u = r.getUrl();
                              if (rules.shouldBlock(u)) {
                                  return new WebResourceResponse("text/plain", "utf-8", 204, "No Content", new HashMap<String, String>(), new java.io.ByteArrayInputStream(new byte[0]));
                              }
                              if (!r.isForMainFrame() && "GET".equalsIgnoreCase(r.getMethod()) && rules.shouldInject(u)) {
                                  WebResourceResponse x = injectIntoEmbed(r);
                                  if (x != null) return x;
                              }
                          } catch (Throwable t) {
                              // Hata olursa normal yukleme devam eder
                          }
                          return null;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame() && !fellBack) {
                              fellBack = true;
                              loadBundled();
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view;
                          customCb = cb;
                          root.addView(view, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          web.setVisibility(View.GONE);
                          immersive();
                      }

                      @Override
                      public void onHideCustomView() {
                          hideCustom();
                      }

                      @Override
                      public Bitmap getDefaultVideoPoster() {
                          return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                      }
                  });
              }

              private void hideCustom() {
                  if (customView == null) return;
                  root.removeView(customView);
                  customView = null;
                  web.setVisibility(View.VISIBLE);
                  if (customCb != null) { try { customCb.onCustomViewHidden(); } catch (Exception ignored) {} customCb = null; }
                  web.requestFocus();
                  immersive();
              }

              private void load() {
                  String url = getString(R.string.start_url).trim();
                  if (url.length() > 0) {
                      web.loadUrl(url + (url.contains("?") ? "&" : "?") + "tv=1&t=" + System.currentTimeMillis());
                  } else {
                      loadBundled();
                  }
              }

              private void loadBundled() {
                  try {
                      InputStream in = getAssets().open("tvcast.html");
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      String html = out.toString("UTF-8");
                      String inject = "<script>try{localStorage.setItem('tv_tv_mode','1')}catch(e){}</script>";
                      int i = html.indexOf("<head>");
                      html = (i >= 0) ? html.substring(0, i + 6) + inject + html.substring(i + 6) : inject + html;
                      web.loadDataWithBaseURL(BASE_URL, html, "text/html", "UTF-8", null);
                  } catch (Exception e) {
                      Toast.makeText(this, "tvcast.html yüklenemedi", Toast.LENGTH_LONG).show();
                  }
              }

              /** JS -> Java kopru (window.Android) */
              private class Bridge {
                  @JavascriptInterface
                  public boolean isCellular() {
                      try {
                          ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                          if (cm == null) return false;
                          if (Build.VERSION.SDK_INT >= 23) {
                              Network n = cm.getActiveNetwork();
                              if (n == null) return false;
                              NetworkCapabilities c = cm.getNetworkCapabilities(n);
                              return c != null && c.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) && !c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) && !c.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET);
                          }
                          NetworkInfo ni = cm.getActiveNetworkInfo();
                          return ni != null && ni.getType() == ConnectivityManager.TYPE_MOBILE;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void nowPlaying(String title, boolean playing) {
                      startPlayback(title, playing);
                  }

                  @JavascriptInterface
                  public void saveRules(String text) {
                      if (text != null && text.length() > 20 && text.length() < 200000) rules.save(MainActivity.this, text);
                  }

                  @JavascriptInterface
                  public void setAdBlock(boolean on) {
                      rules.setEnabled(MainActivity.this, on);
                  }
              }

              private void startPlayback(String title, boolean playing) {
                  try {
                      Intent i = new Intent(this, PlaybackService.class);
                      i.putExtra("title", title);
                      i.putExtra("playing", playing);
                      if (!serviceUp && Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                      serviceUp = true;
                  } catch (Exception ignored) {
                  }
              }

              private void registerCommandReceiver() {
                  cmdReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context c, Intent i) {
                          String cmd = i.getStringExtra("cmd");
                          String js = "next".equals(cmd) ? "nextCh()" : ("prev".equals(cmd) ? "prevCh()" : "togglePlayPause()");
                          web.evaluateJavascript("try{" + js + "}catch(e){}", null);
                      }
                  };
                  IntentFilter f = new IntentFilter(PlaybackService.ACTION_CMD);
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(cmdReceiver, f, Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(cmdReceiver, f);
              }

              private void askNotificationPermission() {
                  try {
                      if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 77);
                      }
                  } catch (Exception ignored) {
                  }
              }

              /** YouTube gomulu oynatici sayfasina reklam engelleyici betigini enjekte eder. */
              private WebResourceResponse injectIntoEmbed(WebResourceRequest r) {
                  HttpURLConnection c = null;
                  try {
                      String url = r.getUrl().toString();
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(10000);
                      c.setInstanceFollowRedirects(true);
                      for (Map.Entry<String, String> e : r.getRequestHeaders().entrySet()) {
                          if (e.getKey().equalsIgnoreCase("Accept-Encoding")) continue;
                          c.setRequestProperty(e.getKey(), e.getValue());
                      }
                      c.setRequestProperty("Accept-Encoding", "identity");
                      String ck = CookieManager.getInstance().getCookie(url);
                      if (ck != null) c.setRequestProperty("Cookie", ck);
                      int code = c.getResponseCode();
                      String ct = c.getContentType();
                      if (code != 200 || ct == null || !ct.toLowerCase(Locale.ROOT).contains("text/html")) {
                          c.disconnect();
                          return null;
                      }
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      String html = out.toString("UTF-8");
                      String tag = "<script>" + rules.script + "</script>";
                      int hi = html.toLowerCase(Locale.ROOT).indexOf("<head>");
                      html = (hi >= 0) ? html.substring(0, hi + 6) + tag + html.substring(hi + 6) : tag + html;
                      Map<String, String> headers = new HashMap<>();
                      for (Map.Entry<String, List<String>> e : c.getHeaderFields().entrySet()) {
                          String k = e.getKey();
                          if (k == null) continue;
                          String lk = k.toLowerCase(Locale.ROOT);
                          if (lk.equals("set-cookie")) {
                              for (String sc : e.getValue()) CookieManager.getInstance().setCookie(url, sc);
                              continue;
                          }
                          if (lk.equals("content-encoding") || lk.equals("content-length") || lk.equals("transfer-encoding") || lk.startsWith("content-security-policy")) continue;
                          StringBuilder sb = new StringBuilder();
                          for (String v : e.getValue()) { if (sb.length() > 0) sb.append(", "); sb.append(v); }
                          headers.put(k, sb.toString());
                      }
                      c.disconnect();
                      return new WebResourceResponse("text/html", "UTF-8", 200, "OK", headers, new java.io.ByteArrayInputStream(html.getBytes("UTF-8")));
                  } catch (Throwable t) {
                      try { if (c != null) c.disconnect(); } catch (Throwable ignored) { }
                      return null;
                  }
              }

              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) immersive();
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) { hideCustom(); return; }
                  String js = "(function(){var l=document.getElementById('leftSidebar'),r=document.getElementById('rightSidebar');"
                          + "if((l&&l.classList.contains('open'))||(r&&r.classList.contains('open'))){closeAllDrawers();return 1}return 0})()";
                  web.evaluateJavascript(js, value -> {
                      if ("1".equals(value)) return;
                      long now = System.currentTimeMillis();
                      if (now - lastBack < 2500) {
                          finish();
                      } else {
                          lastBack = now;
                          Toast.makeText(MainActivity.this, "Çıkmak için tekrar Geri'ye basın", Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              @Override
              protected void onPause() {
                  // Bilerek web.onPause() cagrilmiyor: uygulama kucultulunce ses calmaya devam etsin
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  try { if (cmdReceiver != null) unregisterReceiver(cmdReceiver); } catch (Exception ignored) { }
                  try { stopService(new Intent(this, PlaybackService.class)); } catch (Exception ignored) { }
                  if (web != null) { web.loadUrl("about:blank"); web.destroy(); }
                  super.onDestroy();
              }
          }
          TVCAST_EOF
          cat > app/src/main/java/com/tvcast/player/AdRules.java <<'TVCAST_EOF'
          package com.tvcast.player;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.net.Uri;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          /** rules.txt kurallarini tutar: [scope] [block] [allow] [inject] [script] bolumleri. */
          public class AdRules {
              private static final String PREF = "tvcast_rules";
              public volatile boolean enabled = true;
              public volatile String script = "";
              private volatile List<String> scope = new ArrayList<>();
              private volatile List<String> block = new ArrayList<>();
              private volatile List<String> allow = new ArrayList<>();
              private volatile List<String> inject = new ArrayList<>();

              public void load(Context c) {
                  SharedPreferences p = c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                  enabled = p.getBoolean("enabled", true);
                  String t = p.getString("rules", null);
                  if (t == null) t = readAsset(c, "rules.txt");
                  if (t != null) parse(t);
              }

              public void save(Context c, String text) {
                  c.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString("rules", text).apply();
                  parse(text);
              }

              public void setEnabled(Context c, boolean on) {
                  enabled = on;
                  c.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putBoolean("enabled", on).apply();
              }

              private String readAsset(Context c, String name) {
                  try {
                      InputStream in = c.getAssets().open(name);
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      return out.toString("UTF-8");
                  } catch (Exception e) {
                      return null;
                  }
              }

              private void parse(String text) {
                  List<String> sc = new ArrayList<>(), bl = new ArrayList<>(), al = new ArrayList<>(), ij = new ArrayList<>();
                  StringBuilder js = new StringBuilder();
                  String section = "";
                  for (String raw : text.split("\r?\n")) {
                      String line = raw.trim();
                      if (line.startsWith("[") && line.endsWith("]")) {
                          section = line.substring(1, line.length() - 1).toLowerCase(Locale.ROOT);
                          continue;
                      }
                      if (section.equals("script")) {
                          js.append(raw).append('\n');
                          continue;
                      }
                      if (line.isEmpty() || line.startsWith("#") || line.startsWith("!")) continue;
                      if (section.equals("scope")) sc.add(line.toLowerCase(Locale.ROOT));
                      else if (section.equals("block")) bl.add(line);
                      else if (section.equals("allow")) al.add(line);
                      else if (section.equals("inject")) ij.add(line);
                  }
                  scope = sc; block = bl; allow = al; inject = ij; script = js.toString().trim();
              }

              private boolean inScope(Uri u) {
                  String h = u.getHost();
                  if (h == null) return false;
                  h = h.toLowerCase(Locale.ROOT);
                  for (String s : scope) {
                      if (h.equals(s) || h.endsWith("." + s)) return true;
                  }
                  return false;
              }

              public boolean shouldBlock(Uri u) {
                  if (!enabled || !inScope(u)) return false;
                  String url = u.toString();
                  for (String a : allow) if (url.contains(a)) return false;
                  for (String b : block) if (url.contains(b)) return true;
                  return false;
              }

              public boolean shouldInject(Uri u) {
                  if (!enabled || script.isEmpty()) return false;
                  String url = u.toString();
                  for (String i : inject) if (url.contains(i)) return true;
                  return false;
              }
          }
          TVCAST_EOF
          cat > app/src/main/java/com/tvcast/player/PlaybackService.java <<'TVCAST_EOF'
          package com.tvcast.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.media.MediaMetadata;
          import android.media.browse.MediaBrowser;
          import android.service.media.MediaBrowserService;
          import java.util.ArrayList;
          import java.util.List;

          /** Arka planda calmayi surduren on plan servisi + bildirimde onceki / oynat-durdur / sonraki dugmeleri. */
          public class PlaybackService extends MediaBrowserService {
              public static final String ACTION_CMD = "com.tvcast.player.CMD";
              private static final String CHANNEL = "tvcast_playback";
              private static final int NOTIF_ID = 4711;
              private MediaSession session;
              private PowerManager.WakeLock wake;
              private String title = "TV Cast";
              private boolean playing = true;

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Oynatma", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
                  session = new MediaSession(this, "TVCast");
                  session.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { send("toggle"); }
                      @Override public void onPause() { send("toggle"); }
                      @Override public void onSkipToNext() { send("next"); }
                      @Override public void onSkipToPrevious() { send("prev"); }
                  });
                  try { session.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS | MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS); } catch (Exception ignored) { }
                  try { setSessionToken(session.getSessionToken()); } catch (Exception ignored) { }
                  session.setActive(true);
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "tvcast:playback");
                      wake.setReferenceCounted(false);
                  } catch (Exception ignored) { }
              }

              private void send(String cmd) {
                  Intent i = new Intent(ACTION_CMD);
                  i.setPackage(getPackageName());
                  i.putExtra("cmd", cmd);
                  sendBroadcast(i);
              }

              private PendingIntent pi(String cmd, int code) {
                  Intent i = new Intent(ACTION_CMD);
                  i.setPackage(getPackageName());
                  i.putExtra("cmd", cmd);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getBroadcast(this, code, i, flags);
              }

              private Notification build() {
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle(title)
                          .setContentText(playing ? "Oynatılıyor" : "Duraklatıldı")
                          .setOngoing(true)
                          .setShowWhen(false)
                          .setVisibility(Notification.VISIBILITY_PUBLIC);
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) f |= PendingIntent.FLAG_IMMUTABLE;
                  b.setContentIntent(PendingIntent.getActivity(this, 0, open, f));
                  b.addAction(new Notification.Action.Builder(android.R.drawable.ic_media_previous, "Önceki", pi("prev", 1)).build());
                  b.addAction(new Notification.Action.Builder(playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play, playing ? "Durdur" : "Oynat", pi("toggle", 2)).build());
                  b.addAction(new Notification.Action.Builder(android.R.drawable.ic_media_next, "Sonraki", pi("next", 3)).build());
                  b.setStyle(new Notification.MediaStyle().setMediaSession(session.getSessionToken()).setShowActionsInCompactView(0, 1, 2));
                  return b.build();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) {
                      String t = intent.getStringExtra("title");
                      if (t != null && !t.isEmpty()) title = t;
                      playing = intent.getBooleanExtra("playing", true);
                  }
                  try {
                      PlaybackState st = new PlaybackState.Builder()
                              .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE
                                      | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS)
                              .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, PlaybackState.PLAYBACK_POSITION_UNKNOWN, 1f, SystemClock.elapsedRealtime())
                              .build();
                      session.setMetadata(new MediaMetadata.Builder()
                              .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                              .putString(MediaMetadata.METADATA_KEY_DISPLAY_TITLE, title)
                              .putString(MediaMetadata.METADATA_KEY_ARTIST, "TV Cast")
                              .build());
                      session.setActive(true);
                      session.setPlaybackState(st);
                  } catch (Exception ignored) { }
                  Notification n = build();
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      else startForeground(NOTIF_ID, n);
                  } catch (Exception e) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  try {
                      if (wake != null) {
                          if (playing && !wake.isHeld()) wake.acquire(6 * 60 * 60 * 1000L);
                          else if (!playing && wake.isHeld()) wake.release();
                      }
                  } catch (Exception ignored) { }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  try { if (wake != null && wake.isHeld()) wake.release(); } catch (Exception ignored) { }
                  try { if (session != null) { session.setActive(false); session.release(); } } catch (Exception ignored) { }
                  super.onDestroy();
              }

              @Override
              public BrowserRoot onGetRoot(String clientPackageName, int clientUid, Bundle rootHints) {
                  return new BrowserRoot("tvcast_root", null);
              }

              @Override
              public void onLoadChildren(String parentId, Result<List<MediaBrowser.MediaItem>> result) {
                  result.sendResult(new ArrayList<MediaBrowser.MediaItem>());
              }
          }
          TVCAST_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'TVCAST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">TV Cast</string>
              <string name="start_url">__START_URL__</string>
          </resources>
          TVCAST_EOF
          sed -i "s|__START_URL__|$START_URL|" app/src/main/res/values/strings.xml
          cat > make_icons.py <<'TVCAST_EOF'
          from PIL import Image, ImageDraw, ImageFont
          import glob
          P='app/src/main/res/'
          def font(sz):
              for f in glob.glob('/usr/share/fonts/**/*Bold*.ttf',recursive=True)+glob.glob('/usr/share/fonts/**/*.ttf',recursive=True):
                  try: return ImageFont.truetype(f,sz)
                  except Exception: pass
              return ImageFont.load_default()
          def grad(w,h):
              im=Image.new('RGB',(w,h)); px=im.load()
              for y in range(h):
                  for x in range(w):
                      t=(x/w*0.6+y/h*0.4)
                      px[x,y]=(int(30+70*t),int(20+40*t),int(70+110*t))
              return im
          b=grad(640,360); d=ImageDraw.Draw(b)
          d.text((320,150),'TV Cast',font=font(150),fill='white',anchor='mm')
          d.rounded_rectangle((250,260,390,272),6,fill=(0,206,201))
          b.resize((320,180),Image.LANCZOS).save(P+'drawable-xhdpi/banner.png')
          i=grad(192,192); d=ImageDraw.Draw(i)
          d.rounded_rectangle((34,52,158,128),12,outline='white',width=8)
          d.line((78,148,114,148),fill='white',width=8); d.line((96,128,96,148),fill='white',width=8)
          d.polygon([(86,76),(86,104),(112,90)],fill=(0,206,201))
          i.save(P+'mipmap-xxxhdpi/ic_launcher.png')
          TVCAST_EOF
          python3 -m pip install pillow -q --break-system-packages || pip install pillow -q
          python3 make_icons.py
          if [ -f rules.txt ]; then cp rules.txt app/src/main/assets/rules.txt; fi
          if [ -f tvcast.html ]; then cp tvcast.html app/src/main/assets/tvcast.html
          elif [ -f index.html ]; then cp index.html app/src/main/assets/tvcast.html
          else echo "HATA: depoda tvcast.html veya index.html bulunamadi"; exit 1; fi

      - name: Sabit imza anahtari (guncellemelerin ustune kurulabilmesi icin)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK dosyasini hazirla
        run: cp app/build/outputs/apk/debug/app-debug.apk tvcast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvcast-apk
          path: tvcast.apk

      - name: Herkese acik indirme baglantisi olustur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest tvcast.apk --title "TV Cast APK (son derleme)" --notes "Mi Stick icin APK."
