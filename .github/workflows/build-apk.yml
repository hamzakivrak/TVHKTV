          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;

          /** Ayni Wi-Fi'daki telefondan gelen basit komutlari (HTTP) kabul eden kucuk sunucu. Kod ile korunur. */
          public class RemoteServer {
              public interface Handler {
                  void onCommand(String json);
              }

              private final int port;
              private final String code;
              private final Handler handler;
              private volatile boolean running = false;
              private ServerSocket server;

              public RemoteServer(int port, String code, Handler handler) {
                  this.port = port;
                  this.code = code;
                  this.handler = handler;
              }

              public void start() {
                  running = true;
                  Thread t = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          loop();
                      }
                  });
                  t.setDaemon(true);
                  t.start();
              }

              public void stop() {
                  running = false;
                  try {
                      if (server != null) server.close();
                  } catch (Exception ignored) {
                  }
              }

              private void loop() {
                  try {
                      server = new ServerSocket();
                      server.setReuseAddress(true);
                      server.bind(new InetSocketAddress(port));
                      while (running) {
                          Socket s = server.accept();
                          try {
                              handle(s);
                          } catch (Exception ignored) {
                          } finally {
                              try {
                                  s.close();
                              } catch (Exception ignored) {
                              }
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void handle(Socket s) throws Exception {
                  s.setSoTimeout(4000);
                  InputStream in = s.getInputStream();
                  OutputStream out = s.getOutputStream();
                  ByteArrayOutputStream hb = new ByteArrayOutputStream();
                  int c;
                  int n = 0;
                  int st = 0;
                  while ((c = in.read()) != -1) {
                      hb.write(c);
                      n++;
                      if (n > 16384) break;
                      if (c == '\r' && (st == 0 || st == 2)) {
                          st++;
                      } else if (c == '\n' && (st == 1 || st == 3)) {
                          st++;
                          if (st == 4) break;
                      } else {
                          st = (c == '\r') ? 1 : 0;
                      }
                  }
                  String head = hb.toString("ISO-8859-1");
                  int eol = head.indexOf("\r\n");
                  String first = eol > 0 ? head.substring(0, eol) : head;
                  if (first.startsWith("GET /ping")) {
                      if (first.contains("code=" + code)) {
                          reply(out, 200, "TVCAST");
                      } else {
                          Thread.sleep(500);
                          reply(out, 403, "BAD CODE");
                      }
                      return;
                  }
                  if (first.startsWith("POST /cmd")) {
                      int len = 0;
                      java.util.regex.Matcher m = java.util.regex.Pattern.compile("(?i)content-length:\\s*(\\d+)").matcher(head);
                      if (m.find()) len = Integer.parseInt(m.group(1));
                      if (len <= 0 || len > 65536) {
                          reply(out, 400, "BAD LENGTH");
                          return;
                      }
                      byte[] body = new byte[len];
                      int got = 0;
                      while (got < len) {
                          int r = in.read(body, got, len - got);
                          if (r < 0) break;
                          got += r;
                      }
                      JSONObject o;
                      try {
                          o = new JSONObject(new String(body, 0, got, "UTF-8"));
                      } catch (Exception e) {
                          reply(out, 400, "BAD JSON");
                          return;
                      }
                      if (!code.equals(o.optString("code"))) {
                          Thread.sleep(500);
                          reply(out, 403, "BAD CODE");
                          return;
                      }
                      o.remove("code");
                      handler.onCommand(o.toString());
                      reply(out, 200, "OK");
                      return;
                  }
                  reply(out, 404, "NOT FOUND");
              }

              private void reply(OutputStream out, int status, String text) throws Exception {
                  byte[] b = text.getBytes("UTF-8");
                  String head = "HTTP/1.1 " + status + " X\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Length: " + b.length + "\r\nConnection: close\r\n\r\n";
                  out.write(head.getBytes("ISO-8859-1"));
                  out.write(b);
                  out.flush();
              }
          }
