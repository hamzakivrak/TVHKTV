              private WebResourceResponse injectIntoEmbed(WebResourceRequest r) {
                  HttpURLConnection c = null;
                  try {
                      String url = r.getUrl().toString();
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(10000);
                      c.setInstanceFollowRedirects(true);
                      for (Map.Entry<String, String> e : r.getRequestHeaders().entrySet()) {
                          if (e.getKey().equalsIgnoreCase("Accept-Encoding")) continue;
                          c.setRequestProperty(e.getKey(), e.getValue());
                      }
                      c.setRequestProperty("Accept-Encoding", "identity");
                      String ck = CookieManager.getInstance().getCookie(url);
                      if (ck != null) c.setRequestProperty("Cookie", ck);
                      int code = c.getResponseCode();
                      String ct = c.getContentType();
                      if (code != 200 || ct == null || !ct.toLowerCase(Locale.ROOT).contains("text/html")) {
                          c.disconnect();
                          return null;
                      }
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      String html = out.toString("UTF-8");
                      String tag = "<script>" + rules.script + "</script>";
                      int hi = html.toLowerCase(Locale.ROOT).indexOf("<head>");
                      html = (hi >= 0) ? html.substring(0, hi + 6) + tag + html.substring(hi + 6) : tag + html;
                      Map<String, String> headers = new HashMap<>();
                      for (Map.Entry<String, List<String>> e : c.getHeaderFields().entrySet()) {
                          String k = e.getKey();
                          if (k == null) continue;
                          String lk = k.toLowerCase(Locale.ROOT);
                          if (lk.equals("set-cookie")) {
                              for (String sc : e.getValue()) CookieManager.getInstance().setCookie(url, sc);
                              continue;
                          }
                          if (lk.equals("content-encoding") || lk.equals("content-length") || lk.equals("transfer-encoding") || lk.startsWith("content-security-policy")) continue;
                          StringBuilder sb = new StringBuilder();
                          for (String v : e.getValue()) { if (sb.length() > 0) sb.append(", "); sb.append(v); }
                          headers.put(k, sb.toString());
                      }
                      c.disconnect();
                      return new WebResourceResponse("text/html", "UTF-8", 200, "OK", headers, new java.io.ByteArrayInputStream(html.getBytes("UTF-8")));
                  } catch (Throwable t) {
                      try { if (c != null) c.disconnect(); } catch (Throwable ignored) { }
                      return null;
                  }
              }

