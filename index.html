<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>TV Cast - Smart Player OS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        :root {
            --bg: #000;
            --panel: #14151a;
            --surface: #1e2028;
            --primary: #6c5ce7;
            --text: #fff;
            --border: #2d2e36;
            --red: #e74c3c;
            --fav: #f1c40f;
            --accent2: #00cec9;
            --glass: rgba(18, 19, 26, 0.92);
            --grid-cols: 4;
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; user-select: none; }

        #playerWrapper { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; display: flex; flex-direction: column; z-index: 1; touch-action: none; cursor: default; outline: none; }
        video#localPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 2; }
        video::cue { background-color: rgba(0, 0, 0, 0.85); color: white; font-size: 1.2rem; } 
        
        #ytContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background: #000; display: none; pointer-events: none; }
        #ytContainer iframe { width: 100%; height: 100%; border: none; }

        #castOnlyScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 40%, rgba(108,92,231,.35), #05050a 70%); z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center; color: #aaa; pointer-events: none; }
        #castOnlyScreen i { font-size: 64px; color: var(--primary); margin-bottom: 15px; opacity: 0.8; }
        #castOnlyTitle { color: #fff; margin: 0 0 10px 0; font-weight: 500; font-size: 1.5rem; text-align: center; padding: 0 20px; }
        #castOnlySubtitle { margin: 0; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }

        #liveSubtitleOverlay {
            position: absolute; left: 50%; transform: translateX(-50%); bottom: 10%;
            background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 8px;
            font-size: 18px; z-index: 20; display: none; text-align: center;
            max-width: 90%; word-wrap: break-word; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #controlsOverlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 15; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; opacity: 1; transition: opacity 0.25s ease; background: transparent; }
        #controlsOverlay.hide, #controlsOverlay.hide * { opacity: 0; pointer-events: none !important; }
        
        .top-bar { padding: 18px 28px 40px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.4) 65%, transparent); pointer-events: none; }
        .top-bar > * { pointer-events: auto; }
        .top-title { font-weight: 600; font-size: 1.3rem; text-shadow: 0 2px 4px #000; display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
        #previewTitle { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.65rem; }
        .top-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .status-badge { font-size: 0.85rem; color: #fff; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; width: fit-content; padding: 4px 12px; border-radius: 20px; background: rgba(108,92,231,.28); border: 1px solid rgba(108,92,231,.5); }
        .status-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); }
        .ch-counter { font-size: .85rem; color: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,.12); font-variant-numeric: tabular-nums; }
        .ch-counter:empty { display: none; }

        .top-actions { display: flex; gap: 10px; flex-shrink: 0; }
        .center-buttons { display: flex; justify-content: center; align-items: center; gap: 10px; pointer-events: auto; position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%); background: var(--glass); padding: 10px 18px; border-radius: 44px; border: 1px solid rgba(255,255,255,0.12); transition: bottom 0.2s ease; }
        .ctrl-btn { background: transparent; border: none; color: white; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; flex-shrink: 0; }
        .ctrl-btn.main { width: 55px; height: 55px; background: var(--primary); }
        .ctrl-btn.small { width: 40px; height: 40px; } 
        .ctrl-btn.fav-btn.active i { color: var(--fav); }
        .ctrl-btn i { font-size: 28px; }

        .drawer { position: absolute; top: 0; bottom: 0; background: #101116; z-index: 50; transition: transform 0.2s ease-out; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.08); will-change: transform; }
        #leftSidebar { left: 0; width: min(560px, 94vw); transform: translateX(-102%); border-right: 2px solid var(--border); overflow-y: auto; z-index: 60; }
        #leftSidebar.open { transform: translateX(0); }
        
        #rightSidebar { right: 0; left: 0; width: 100vw; transform: translateY(102%); border: none; z-index: 55; }
        #rightSidebar.open { transform: translateY(0); }
        
        .drawer-header { position: sticky; top: 0; background: #161820; padding: 14px 28px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; gap: 14px; z-index: 31; }
        
        .overlay-backdrop { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.78); z-index: 45; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .overlay-backdrop.show { opacity: 1; pointer-events: auto; }

        .settings-content { padding: 20px 24px 40px; }
        .module { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .module-header { padding: 14px 16px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; }
        .module-title { font-size: 0.92rem; font-weight: 600; color: #fff; margin: 0; }
        .module-body { padding: 15px; border-top: 1px solid var(--border); }
        
        input, textarea, select { width: 100%; background: #121318; border: 2px solid var(--border); color: #fff; border-radius: 8px; padding: 10px 12px; box-sizing: border-box; font-family: inherit; margin-bottom:10px; font-size: 0.95rem; }
        textarea { resize: none; height: 60px; }
        input[readonly], textarea[readonly] { cursor: pointer; background: #171820; }
        input.kb-unlocked, textarea.kb-unlocked { border-color: #f1c40f !important; background: #000 !important; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn { flex: 1; min-height: 46px; font-size: 0.92rem; border: 2px solid var(--border); border-radius: 8px; background: #32343e; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .btn-icon { padding: 0 16px; min-height: 44px; background: #32343e; color: white; border-radius: 8px; cursor: pointer; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 600; gap: 6px; font-size: 0.92rem; }

        .sub-module { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .sub-module:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .sub-module-title { font-size: 0.82rem; color: #bbb; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; display: block; }

        .yt-search-results { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: #121212; display: none; margin-bottom: 10px; }
        .yt-search-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.85rem; }
        .yt-search-item img { width: 50px; height: 32px; object-fit: cover; border-radius: 4px; }
        .yt-search-item:focus { background: rgba(0, 206, 201, 0.18); outline: none; }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18px 28px 40px;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols, 4), minmax(0, 1fr));
            gap: 14px;
            align-content: start;
            width: 100%;
        }
        .channel-item {
            background: #1c1e26;
            border: 3px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 10px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 7px;
            color: #ececec;
            position: relative;
            height: 104px;
            min-width: 0;
            overflow: hidden;
        }
        .channel-item.active { border-color: var(--primary); background: #252244; }
        .channel-item:focus, .channel-item:focus-visible {
            outline: none !important;
            border-color: var(--accent2) !important;
            background: #163638 !important;
            color: #fff;
            z-index: 2;
        }
        .channel-item.broken { opacity: 0.42; }
        .channel-item.broken .name { text-decoration: line-through; }
        
        .c-icon { width: 56px; height: 36px; border-radius: 6px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .c-icon img { width: 100%; height: 100%; object-fit: contain; }
        .name { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.92rem; font-weight: 600; line-height: 1.25; }
        .ch-num-badge { position: absolute; top: 6px; left: 8px; font-size: 0.72rem; color: #888; font-weight: 700; }
        .channel-item:focus .ch-num-badge, .channel-item.active .ch-num-badge { color: var(--accent2); }
        .fav-icon { position: absolute; top: 5px; right: 6px; color: #444; font-size: 17px; padding: 2px; }
        .fav-icon.active { color: var(--fav); }
        .del-icon { position: absolute; bottom: 5px; right: 6px; color: rgba(231, 76, 60, 0.7); font-size: 16px; }
        .q-chk { width: 18px !important; height: 18px; margin: 0 !important; accent-color: var(--primary); position: absolute; bottom: 5px; left: 6px; }
        .q-test { position: absolute; bottom: 4px; right: 24px; color: #aaa; font-size: 16px; }

        .osd-title { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(12,13,18,.95); color: #fff; padding: 14px 32px; border-radius: 20px; font-size: 1.4rem; font-weight: 600; opacity: 0; transition: opacity 0.2s ease; z-index: 80; pointer-events: none; border: 2px solid rgba(0,206,201,0.35); white-space: nowrap; max-width: 88%; overflow: hidden; text-overflow: ellipsis; text-align: center; }
        .osd-title.show { opacity: 1; }

        #bufSpinner { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; z-index: 12; display: none; pointer-events: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        button:focus, select:focus, input:focus, textarea:focus, .module-header:focus, .yt-search-item:focus {
            outline: 3px solid var(--accent2) !important;
            outline-offset: 2px;
        }

        #tvPicker { position: fixed; inset: 0; z-index: 100000; background: rgba(0,0,0,.86); display: flex; align-items: center; justify-content: center; }
        .tvp-card { width: min(640px, 88vw); max-height: 82vh; overflow: auto; background: #1a1c23; border: 2px solid var(--accent2); border-radius: 18px; padding: 12px; }
        .tvp-group { padding: 10px 16px 4px; color: #8e8e9a; font-size: .95rem; font-weight: 700; }
        .tvp-item { padding: 14px 18px; font-size: 1.15rem; border-radius: 12px; margin: 3px 0; color: #fff; cursor: pointer; }
        .tvp-item.sel { background: rgba(0,206,201,.28); outline: 3px solid var(--accent2); }

        .ctrl-btn:focus, .ctrl-btn:focus-visible, .top-actions .btn-icon:focus {
            outline: 3px solid var(--accent2) !important;
            outline-offset: 3px;
            background: rgba(0, 206, 201, 0.28) !important;
            transform: scale(1.12);
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .ctrl-btn.main:focus, .ctrl-btn.main:focus-visible {
            background: var(--accent2) !important;
            color: #000 !important;
        }
        .ctrl-hint-pill {
            position: absolute; bottom: 136px; left: 50%; transform: translateX(-50%);
            background: rgba(14, 15, 22, 0.88); color: #ccc; font-size: 0.78rem;
            padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12);
            pointer-events: none; white-space: nowrap; transition: all 0.2s ease;
        }
        .ctrl-hint-pill.screen-active {
            border-color: var(--accent2);
            color: #fff;
            background: rgba(0, 206, 201, 0.22);
            box-shadow: 0 0 14px rgba(0, 206, 201, 0.35);
        }
        .seek-bar-wrap {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: min(680px, 88vw); background: rgba(14, 15, 22, 0.94);
            padding: 7px 16px; border-radius: 22px; border: 1px solid rgba(0, 206, 201, 0.35);
            display: none; align-items: center; gap: 12px; pointer-events: none;
            box-shadow: 0 6px 22px rgba(0,0,0,0.7);
            z-index: 16;
        }
        .seek-bar-wrap.show { display: flex; }
        .seek-time { font-size: 0.82rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; }
        .seek-step-badge { font-size: 0.78rem; font-weight: 700; color: var(--fav); padding: 2px 8px; border-radius: 12px; background: rgba(241, 196, 15, 0.16); white
